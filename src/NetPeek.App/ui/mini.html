<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NetPeek 小窗</title>
  <!-- 令牌先加载：mini.css 里的规则全部读它，顺序反了首帧就是一片无色。 -->
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="mini.css" />
</head>
<body>
  <!-- 能量球形态（默认，窗口 112×112，球体 92×92 正圆，四周 10px 留给投影）。
       中途曾改成 176×38 的横向胶囊，理由是排版预算；那一版被推翻 —— 宽高比 4.6:1
       的圆角矩形读作椭圆，而「能量球」这个概念的载体首先是圆。预算改由**纵排**
       解决：状态核心 / 下载 15px / 上传 11px 三行叠在球心那条宽带里（92 的圆在
       中心一带弦宽 84–92px，三行合计只占 38px 高，够用）。上一版真正的瓶颈不是
       圆，是那两圈同心环吃掉的 18px 环带 —— 环已撤掉，两条理由：
       ① 内环 2px 笔画在 125%/150% 缩放下被光栅化成 2.5–3px，和 4px 外环的重量差
          被抹平，两环读作一圈粗边；
       ② 环的分母原是「近 60 秒峰值」这个浮动值，环走到 80% 读不出是 8 MB/s 还是
          80 KB/s —— 环形进度天然暗示「占某个固定总量」，符号与语义本身错配。
       水位改成球腔里自下而上的能量液，分母换成固定档位（见 mini.js 的 TIERS）。

       不用 data-tauri-drag-region：它在 mousedown 就进入系统拖动，click 永远不会触发，
       球点不开。拖动由 mini.js 的位移阈值 + startDragging() 自己处理。 -->
  <div id="orb" class="orb" title="NetPeek" role="button" tabindex="0"
       aria-label="NetPeek：点击展开迷你窗">
    <!-- 底图层。必须是真实元素而不是伪元素：球的两个伪元素已经被漆层（::after）
         与内缘光照（::before）占满，而底图这一层要单独吃 filter（模糊 + 主窗那组
         透镜），挂到 .orb 自己身上会把 1px 边线和球里的读数一起糊掉。
         图的参数全部由 theme-changed 广播过来，无图时 --theme-bg-image 是 none，
         整层不显影，所以这个元素在纯色皮肤下没有任何代价。 -->
    <span class="orb-bg" aria-hidden="true"></span>
    <!-- 球上没有状态点：这里曾经有过两版 7px 的小圆点（纵排三行顶上的「状态核心」
         带白热内核 + 同色辉光，以及后来挪到左下 8 点方向的位置修正版），都被否了。
         根因不是位置也不是那圈辉光 —— **球上根本不该有这颗点**：92px 的球里
         已经装着下载/上传两个读数，第三样东西塞进去无论放哪都要跟读数抢地方；
         而它一个字节都不代表。状态是「监控中/已暂停/异常」，属于本形态的附带
         信息，正式位置在迷你窗面板头（.panel-dot）与主界面顶栏。
         球这一形态只回答「在下多快 / 在上多快」。
         状态没有丢：采集断开那一路由 pipe-status 直接改写整个球的 title，见 mini.js。 -->
    <!-- 下载是主值：字号 15，比上传大一档。方向除了颜色还给箭头，
         因为「琥珀 = 下载」这条约定只在本应用内成立，第一次见的人读不出来。 -->
    <span class="orb-rate is-down">
      <svg class="a" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14" /><path d="m19 12-7 7-7-7" /></svg>
      <span class="v" id="orbDownV">--</span><span class="u" id="orbDownU"></span>
    </span>
    <span class="orb-rate is-up">
      <svg class="a" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5" /><path d="m5 12 7-7 7 7" /></svg>
      <span class="v" id="orbUpV">--</span><span class="u" id="orbUpU"></span>
    </span>
    <!-- 能量液：球即容器，下载速率是注进球腔的能量（分母是 mini.js 的固定档位
         TIERS），从球底向上灌注、垫在读数之下，被圆轮廓裁成一段弓形。
         不做成底边一条细线：悬在底边的细线读作「一条线」，读不出「容器里的
         东西在多起来」。
         液面不是一条水平的硬边 —— 见 mini.css 的 .orb-wave：水面要有起伏，
         平口读作「一块被裁成弓形的色块」，而不是「球里有液体」。
         高度由 mini.js 写进 --level。 -->
    <span class="orb-level" aria-hidden="true">
      <i id="orbLevel"></i>
      <!-- 液面波形：SVG 路径定义连续的波峰 / 波谷，并在右侧复制一个完整周期。
           轨道横移正好一个周期后与起始几何完全重合，循环点看不出接缝。
           之所以从「径向渐变拼圆弧」换成路径：渐变画出来的是一串半圆，
           峰谷交界处是尖角；正弦路径的起伏是连续的，读起来才是水面。
           振幅由 viewBox 里的 3 个用户单位控制（92px 球上约 3px），
           波长 50 单位 → 视口内约 3 个波峰，与同类实现的密度一致。
           没有 id：波形是纯 CSS（一条轨道位移 + 贴在 --level 上），
           JS 不需要碰它 —— 挂一个没人引用的 id 会被 dom-contract 的
           「无死 id」判据当成遗漏抓出来。 -->
      <svg class="orb-wave" viewBox="0 0 200 16" preserveAspectRatio="none" aria-hidden="true">
        <g class="orb-wave-track">
          <path d="M0 8 Q12.5 3 25 8 T50 8 T75 8 T100 8 T125 8 T150 8 T175 8 T200 8 V16 H0 Z" />
          <path d="M0 8 Q12.5 3 25 8 T50 8 T75 8 T100 8 T125 8 T150 8 T175 8 T200 8 V16 H0 Z"
                transform="translate(200 0)" />
        </g>
      </svg>
    </span>
  </div>

  <!-- 迷你窗形态（点击能量球展开，320×300 面板 / 窗口 344×324） -->
  <div id="panel" class="panel" hidden>
    <div class="panel-head">
      <span class="panel-title">NetPeek</span>
      <span class="panel-dot" id="panelDot" role="img" aria-label="未连接采集服务" title="未连接采集服务"></span>
      <!-- 与主界面顶栏的窗口按钮同一族控件（.icon-btn + 24 viewBox 线性图标），
           不再用「—」「×」文本符号：字符的字面宽与基线随字体走（面板字体栈含
           Microsoft YaHei），两枚相邻按钮的视觉重量对不齐，垂直居中还得靠
           line-height 硬凑。收起图标画的是「能量球」本身（实心点的圆环），
           比一根抽象横线更能说明收起后会变成什么。 -->
      <div class="panel-actions">
        <button type="button" class="icon-btn" id="btnCollapse" title="收起为能量球" aria-label="收起为能量球">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <circle cx="12" cy="12" r="7" stroke-width="1.6" />
            <circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none" />
          </svg>
        </button>
        <button type="button" class="icon-btn is-danger" id="btnClose" title="隐藏小窗" aria-label="隐藏小窗">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
        </button>
      </div>
    </div>

    <div class="panel-total">
      <span class="pt is-down"><svg class="a" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14" /><path d="m19 12-7 7-7-7" /></svg><b class="v" id="ptDownV">--</b><i class="u" id="ptDownU"></i></span>
      <span class="pt is-up"><svg class="a" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5" /><path d="m5 12 7-7 7 7" /></svg><b class="v" id="ptUpV">--</b><i class="u" id="ptUpU"></i></span>
    </div>

    <div class="panel-list" id="panelList"></div>

    <!-- 脚部两枚按钮语义不同，控件类型也就不该相同（原来两枚都是 .pact 等宽描边，
         把导航动作抬到了与状态切换同等的视觉权重上）：
         「暂停/恢复」是双态控件 → toggle（aria-pressed）驱动，图标与配色随状态切换；
         「主界面」是导航动作 → 次级幽灵按钮，按内容宽靠右，不与主操作争注意力。 -->
    <div class="panel-foot">
      <button type="button" class="btn" id="btnPause" aria-pressed="false" title="暂停监控">
        <svg class="ic ic-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <rect x="7.2" y="5.5" width="3.6" height="13" rx="1.2" />
          <rect x="13.2" y="5.5" width="3.6" height="13" rx="1.2" />
        </svg>
        <svg class="ic ic-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M8.4 5.7v12.6c0 .8.9 1.3 1.6.9l9.4-6.3c.6-.4.6-1.3 0-1.7L10 4.8c-.7-.4-1.6.1-1.6.9z" />
        </svg>
        <span class="lbl" id="pauseLbl">暂停</span>
      </button>
      <button type="button" class="btn" id="btnMain" title="打开主界面">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <rect x="4" y="5" width="16" height="14" rx="2.5" />
          <path d="M4 9.5h16" />
        </svg>
        <span class="lbl">主界面</span>
      </button>
    </div>
  </div>

  <!-- theme.js 只为拿 applyTokens / resolveSkin / initTheme：小窗是独立 webview，CSS 变量不跨窗口共享 -->
  <script src="common.js"></script>
  <script src="vendor/chroma.min.js"></script>
  <script src="vendor/color-thief.min.js"></script>
<script src="theme.js"></script>
  <!-- 小窗里没有任何可复制的值，引入它只为把 WebView2 的原生右键菜单（刷新 / 另存为）
       也一起拦掉 —— 一个 92px 的能量球上弹出浏览器菜单，比主窗里更刺眼。 -->
  <script src="context-menu.js"></script>
  <script src="mini.js"></script>
</body>
</html>
