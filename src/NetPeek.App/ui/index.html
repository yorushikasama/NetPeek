<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NetPeek</title>
  <link rel="stylesheet" href="vendor/uPlot.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">NetPeek</div>
    <div class="totals">
      <span class="total-down">↓ <b id="totalDown">0 B/s</b></span>
      <span class="total-up">↑ <b id="totalUp">0 B/s</b></span>
    </div>
    <div class="view-toggle" id="viewToggle">
      <button class="vt active" data-view="process">按进程</button>
      <button class="vt" data-view="app">按应用</button>
    </div>
    <input id="search" class="search" type="text" placeholder="搜索进程名 / PID" autocomplete="off" />
    <button id="themeBtn" class="theme-btn" title="外观与主题">外观</button>
    <div class="status" id="status">未连接采集服务</div>
  </header>

  <div class="content">
    <div class="main-col">
      <section class="chart-panel">
        <div class="chart-head">
          <span class="chart-title">实时速率</span>
          <div class="chips">
            <button class="chip active" data-window="10">10s</button>
            <button class="chip" data-window="60">1m</button>
            <button class="chip" data-window="300">5m</button>
          </div>
        </div>
        <div id="rateChart" class="rate-chart"></div>
      </section>

      <section class="cards" id="cards" aria-label="流量最高的应用"></section>

      <main class="viewport" id="viewport">
        <table class="proc-table">
          <thead>
            <tr>
              <th data-sort="name">应用 <span class="sort-mark"></span></th>
              <th class="num" data-sort="pid"><span class="pid-label">PID</span> <span class="sort-mark"></span></th>
              <th class="num" data-sort="download">下载 <span class="sort-mark"></span></th>
              <th class="num" data-sort="upload">上传 <span class="sort-mark"></span></th>
              <th class="num" data-sort="downloadTotal">下载总量 <span class="sort-mark"></span></th>
              <th class="num" data-sort="uploadTotal">上传总量 <span class="sort-mark"></span></th>
              <th class="num" data-sort="retransmit">重传 <span class="sort-mark"></span></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </main>
    </div>

    <aside class="detail" id="detail" hidden>
      <div class="detail-head">
        <img id="detailIcon" class="detail-icon" alt="" hidden />
        <span id="detailIconPlaceholder" class="detail-icon placeholder"></span>
        <div class="detail-title">
          <div class="detail-name" id="detailName">—</div>
          <div class="detail-sub" id="detailSub">—</div>
        </div>
        <button id="detailClose" class="detail-close" title="关闭详情">×</button>
      </div>
      <dl class="detail-fields">
        <dt>路径</dt><dd id="detailPath">—</dd>
        <dt>PID</dt><dd id="detailPid">—</dd>
        <dt>进程会话</dt><dd id="detailDuration">—</dd>
        <dt>下载总量</dt><dd id="detailDownTotal">—</dd>
        <dt>上传总量</dt><dd id="detailUpTotal">—</dd>
        <dt>重传</dt><dd id="detailRetrans">—</dd>
      </dl>
      <div class="detail-chart-head"><span>近 1 小时速率</span></div>
      <div id="detailChart" class="detail-chart"></div>
      <details class="detail-attrib">
        <summary>归因说明</summary>
        <ul>
          <li>流量按事件载荷中的 PID 归因（内核事件头 PID 常为中断进程，不是流量归属方）。</li>
          <li>忽略 Event 18（数据复制事件），避免下载量重复计数。</li>
          <li>重传单独统计，不混入上传量。</li>
        </ul>
      </details>
    </aside>
  </div>

  <footer class="statusbar" id="statusbar">
    <span id="sb-service"></span>
    <span class="sep"></span>
    <span id="sb-session"></span>
    <span class="sep"></span>
    <span id="sb-coverage"></span>
  </footer>

  <!-- 三模式主题面板 -->
  <div class="theme-overlay" id="themeOverlay" hidden>
    <div class="theme-panel" role="dialog" aria-label="外观与主题">
      <div class="theme-head">
        <div class="theme-title">外观与主题</div>
        <button id="themeClose" class="detail-close" title="关闭">×</button>
      </div>

      <div class="theme-modes">
        <label class="tmode">
          <input type="radio" name="tmode" value="standard" checked />
          <span><b>标准离线取色</b><small>背景图自动配色，完全离线</small></span>
        </label>
        <label class="tmode">
          <input type="radio" name="tmode" value="ai" />
          <span><b>AI 自适应</b><small>多模态模型生成，可保存</small></span>
        </label>
        <label class="tmode">
          <input type="radio" name="tmode" value="custom" />
          <span><b>定制化主题</b><small>预设 / 手动调色</small></span>
        </label>
      </div>

      <!-- 背景（模式 1/2 共用） -->
      <div class="tsec" id="bgSection">
        <div class="tsec-title">背景图</div>
        <div class="bg-actions">
          <button id="bgPick" class="tbtn">选择图片…</button>
          <button id="bgClear" class="tbtn ghost">无背景</button>
          <input type="file" id="bgFile" accept="image/*" hidden />
        </div>
        <div id="bgStatus" class="tnote">未设置背景（使用面板底色）</div>
      </div>

      <!-- 模式 1：标准离线取色 -->
      <div class="tsec" id="stdSection">
        <div class="tsec-title">微调</div>
        <label class="tslider">面板不透明度
          <input type="range" id="stdOpacity" min="0.3" max="1" step="0.01" value="0.92" />
        </label>
        <label class="tslider">背景模糊
          <input type="range" id="stdBlur" min="0" max="40" step="1" value="12" />
        </label>
      </div>

      <!-- 模式 2：AI 自适应 -->
      <div class="tsec" id="aiSection" hidden>
        <div class="tsec-title">AI 提供方</div>
        <label class="tfield">接口地址
          <input type="text" id="aiEndpoint" placeholder="https://api.openai.com/v1" />
        </label>
        <label class="tfield">API Key
          <input type="password" id="aiApiKey" placeholder="sk-…" autocomplete="off" />
        </label>
        <label class="tfield">模型
          <input type="text" id="aiModel" placeholder="gpt-4o-mini" />
        </label>
        <label class="tconsent">
          <input type="checkbox" id="aiConsent" />
          <span>我已了解：背景缩略图将上传至上述服务用于生成配色</span>
        </label>
        <button id="aiGenerate" class="tbtn">生成并应用</button>
        <div id="aiStatus" class="tnote"></div>
      </div>

      <!-- 模式 3：定制化主题 -->
      <div class="tsec" id="customSection" hidden>
        <div class="tsec-title">预设</div>
        <div class="preset-row">
          <button class="tbtn preset" data-preset="dark">经典深色</button>
          <button class="tbtn preset" data-preset="light">经典浅色</button>
          <button class="tbtn preset" data-preset="contrast">高对比</button>
        </div>
        <div class="tsec-title">手动调色</div>
        <div class="color-grid">
          <label>背景<input type="color" id="cBg" value="#111418" /></label>
          <label>面板<input type="color" id="cPanel" value="#1b1f26" /></label>
          <label>边框<input type="color" id="cBorder" value="#2a2f38" /></label>
          <label>文字<input type="color" id="cText" value="#f2e6dc" /></label>
          <label>次要文字<input type="color" id="cMuted" value="#a89184" /></label>
          <label>下载<input type="color" id="cDown" value="#f0913f" /></label>
          <label>上传<input type="color" id="cUp" value="#7fa8c9" /></label>
          <label>正常<input type="color" id="cOk" value="#6fb87a" /></label>
          <label>警告<input type="color" id="cWarn" value="#d9b44a" /></label>
          <label>错误<input type="color" id="cError" value="#e14b3a" /></label>
        </div>
      </div>

      <!-- 保存 / 主题列表 -->
      <div class="tsec">
        <div class="tsec-title">保存与主题列表</div>
        <div class="save-row">
          <input type="text" id="themeName" class="tfield" placeholder="主题名称" />
          <button id="themeSave" class="tbtn">保存主题</button>
        </div>
        <div id="themeList" class="theme-list"></div>
      </div>

      <div class="theme-foot">
        <button id="themeReset" class="tbtn ghost">还原默认</button>
      </div>
    </div>
  </div>

  <script src="vendor/uPlot.iife.min.js"></script>
  <script src="theme.js"></script>
  <script src="theme-ui.js"></script>
  <script src="main.js"></script>
</body>
</html>
